name: PR Agent (Free AI Code Review)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent on every PR, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          # PR-Agent/litellm auto-detects the "openrouter/" model prefix
          # and looks for this exact env var name to authenticate.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Config keys are lowercase, dot-separated, matching PR-Agent's config sections
          config.model: "openrouter/deepseek/deepseek-chat"
          config.fallback_models: '["openrouter/meta-llama/llama-3.1-70b-instruct:free"]'

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"

          pr_reviewer.require_score_review: "false"
          pr_reviewer.require_tests_review: "true"
          pr_reviewer.require_estimate_effort_to_review: "true"
