name: build

on:
  pull_request:
    branches: [main, backend-dev, frontend-dev, database-dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend build
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: npm install && npm run build --if-present

      - name: Frontend build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm install && npm run build --if-present

      - name: Skip note
        if: hashFiles('backend/package.json') == '' && hashFiles('frontend/package.json') == ''
        run: echo "No package.json found yet — CI will activate once code is added."
